<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — BMB WEAR</title><link rel="stylesheet" href="assets/style.css"></head>
<body><div class="adm"><div class="side"><h3>BMB<span style="background:#fff;color:#000;padding:.1rem .4rem">ADMIN</span></h3>
<a href="#" class="on" onclick="tab('dash',this)">Dashboard</a><a href="#" onclick="tab('prods',this)">Produits</a><a href="#" onclick="tab('orders',this)">Commandes</a><a href="index.html">← Site</a></div>
<div style="padding:1.5rem"><div id="v-dash"><h1>Dashboard BMB</h1><div class="kpis"><div class="kpi"><small>CA</small><strong id="k_ca">0</strong></div><div class="kpi"><small>Commandes</small><strong id="k_nb">0</strong></div><div class="kpi"><small>Produits</small><strong id="k_pr">0</strong></div><div class="kpi"><small>Panier moyen</small><strong id="k_pm">0</strong></div></div><div class="panel"><h3>Dernières</h3><div id="last"></div></div></div>
<div id="v-prods" style="display:none"><h1>Produits</h1><form class="box" onsubmit="saveP(event)" style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem"><input id="p_name" required placeholder="Nom"><select id="p_cat"><option value="windbreaker">Windbreaker</option><option value="nike">Nike</option><option value="adidas">Adidas</option><option value="accessoire">Accessoire</option></select><input id="p_price" type="number" required placeholder="Prix"><input id="p_old" type="number" placeholder="Ancien prix"><input id="p_emoji" placeholder="Emoji"><label><input type="checkbox" id="p_trend" style="width:auto"> Tendance</label><button class="btn">+ Ajouter</button></form><div class="panel" style="margin-top:1rem"><table><tbody id="plist"></tbody></table></div></div>
<div id="v-orders" style="display:none"><h1>Commandes</h1><div class="panel"><table><tbody id="olist"></tbody></table></div></div>
</div></div><div class="toast" id="toast"></div>
<script>const DB={get(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};const $=id=>document.getElementById(id);
function tab(v,a){document.querySelectorAll('.side a').forEach(x=>x.classList.remove('on'));a.classList.add('on');['dash','prods','orders'].forEach(x=>$('v-'+x).style.display=x===v?'block':'none')}
function load(){const o=DB.get('bmb_orders',[]),p=DB.get('bmb_products',[]);const ca=o.filter(x=>x.status!=='Annulée').reduce((a,x)=>a+x.total,0);
$('k_ca').textContent=ca.toLocaleString()+' F';$('k_nb').textContent=o.length;$('k_pr').textContent=p.length;$('k_pm').textContent=(o.length?Math.round(ca/o.length):0).toLocaleString();
$('last').innerHTML=o.slice(0,5).map(x=>`<p><b>${x.num}</b> ${x.nom} ${x.total.toLocaleString()} — ${x.status}</p>`).join('')||'Aucune';
$('plist').innerHTML=p.map(x=>`<tr><td>${x.emoji} ${x.name}</td><td>${x.price.toLocaleString()}</td><td><button onclick="delP('${x.id}')">Suppr</button></td></tr>`).join('');
$('olist').innerHTML=o.map((x,i)=>`<tr><td><b>${x.num}</b><br><small>${x.tel}</small></td><td>${x.nom}</td><td>${x.total.toLocaleString()}</td><td><select onchange="st(${i},this.value)">${['En attente','Confirmée','Livrée','Annulée'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button onclick="delO(${i})">✕</button></td></tr>`).join('')||'Aucune'}
function saveP(e){e.preventDefault();let p=DB.get('bmb_products',[]);p.unshift({id:'p'+Date.now(),name:$('p_name').value,cat:$('p_cat').value,price:+$('p_price').value,old:+$('p_old').value||0,emoji:$('p_emoji').value||'👕',trend:$('p_trend').checked,isnew:1});DB.set('bmb_products',p);e.target.reset();load()}
function delP(id){DB.set('bmb_products',DB.get('bmb_products',[]).filter(x=>x.id!==id));load()}
function st(i,v){const o=DB.get('bmb_orders',[]);o[i].status=v;DB.set('bmb_orders',o);load()}
function delO(i){const o=DB.get('bmb_orders',[]);o.splice(i,1);DB.set('bmb_orders',o);load()}
load();</script></body></html>
