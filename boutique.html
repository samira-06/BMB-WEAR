<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMB WEAR — Boutique</title><link rel="stylesheet" href="assets/style.css"></head>
<body><div class="topbar">BMB WEAR — Nouveautés chaque semaine</div>
<header><nav class="nav"><a class="logo" href="index.html">BMB<span>WEAR</span></a><div class="links"><a href="index.html">Accueil</a><a href="boutique.html" class="active">Boutique</a><a href="suivi.html">Suivre</a><a href="compte.html">Compte</a><a href="contact.html">Contact</a></div><button class="icon-btn" onclick="toggleCart()">🛒<b id="count">0</b></button></nav></header>
<section class="section"><div class="sec-head"><div><h2>Boutique</h2><p id="nprod"></p></div><div class="shop-tools"><div class="search"><input id="q" placeholder="Rechercher..." oninput="renderShop()"></div><select id="sort" onchange="renderShop()"><option value="new">Nouveautés</option><option value="asc">Prix croissant</option><option value="desc">Prix décroissant</option></select></div></div>
<div class="filters" id="cats"><button class="on" data-c="all" onclick="setCat(this)">Tout</button><button data-c="windbreaker" onclick="setCat(this)">Windbreaker Brazil</button><button data-c="nike" onclick="setCat(this)">Nike</button><button data-c="adidas" onclick="setCat(this)">Adidas</button><button data-c="accessoire" onclick="setCat(this)">Accessoires</button></div>
<div class="grid" id="grid"></div></section>
<footer><div class="foot"><div><h3>BMB WEAR</h3></div><div><a href="suivi.html">Suivre commande</a></div><div><a href="contact.html">Contact</a></div><div><a href="admin.html">Admin</a></div></div></footer>
<div class="drawer" id="drawer"><header><b>Panier</b><button class="icon-btn" onclick="toggleCart()">✕</button></header><div class="cart-items" id="citems"></div><div style="padding:1rem;border-top:1px solid #2a2a2a"><p id="ctotal"></p><button class="btn" style="width:100%;margin-top:.6rem" onclick="openCheckout()">Commander</button></div></div>
<div class="modal" id="checkout"><div class="sheet"><h2>Commander</h2><input id="c_nom" placeholder="Nom & Prénom"><input id="c_tel" placeholder="Téléphone"><select id="c_zone"><option>Dakar Centre (2000)</option><option>Banlieue (3000)</option><option>Régions (5000)</option></select><input id="c_adr" placeholder="Adresse"><div class="pay"><button onclick="setPay(this,'Wave')" class="on">Wave</button><button onclick="setPay(this,'Orange Money')">Orange</button><button onclick="setPay(this,'Free Money')">Free</button></div><div id="osum"></div><button class="btn" style="width:100%" onclick="confirmOrder()">Confirmer</button><button class="btn ghost" style="width:100%;margin-top:.5rem" onclick="closeM('checkout')">Fermer</button></div></div>
<div class="modal" id="success"><div class="sheet" style="text-align:center"><h2>✓ Confirmée !</h2><p id="s_txt"></p><button class="btn ghost" onclick="closeM('success')">Continuer</button></div></div>
<div class="toast" id="toast"></div><script src="assets/app.js"></script></body></html>
